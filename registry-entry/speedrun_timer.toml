# Draft of the registry entry (mods/speedrun_timer.toml in horizon-rust/horizon-mods).
# The submit form at playhorizon.dev/mods/submit writes this entry and opens the
# pull request for you; this file is a reference for what it will contain.
# Replace <your GitHub username> before submitting.

id = "speedrun_timer"
kind = "native-mod"
name = "Speedrun Timer"
summary = "An RTA timer in a corner: HH:MM:SS.mmm, starts on your first move, stops when you leave the End."
description = """
A real-time-attack timer for Horizon speedruns, compiled into the game as a native mod.

- HH:MM:SS.mmm with unlimited hours and live milliseconds; gold while it runs, green when it stops.
- Arms when a world loads and starts on your first movement; standing still never starts it.
- Stops when you leave the End for the Overworld through the exit portal. Dying in the End
  is not a finish: the death screen suspends it and the run keeps counting.
- Rearms at zero by itself about a second after you leave a world, so a new world starts fresh.
- Settings page: corner (all four, F3/F1 respected), timer shown, personal best,
  a button that opens the timer's folder, and reset. Every finished run is appended to
  runs.csv in horizon-mods/.horizon-mod-data/speedrun_timer/, with last_run.txt beside it.
- Commands: /speedrun, /speedrun start, /speedrun stop, /speedrun reset.

Native source mod: install it on the launcher's Mods page, press Build there and confirm
the native-code warning; the launcher compiles a game with it in an instance of its own.
Uses only Horizon's stable hook points (hooks: 1), tested on Nightly 2026-10-28
(Horizon 6f8c7a0, horizon-mixins 0d6b103).
"""
authors = ["<your GitHub username>"]
owners = ["<your GitHub username>"]
license = "MIT"
source = "https://github.com/<your GitHub username>/speedrun-timer"

[[versions]]
version = "1.0.0"
published = "2026-11-03"
game = "26.3"
file = "speedrun_timer-1.0.0.hnmod"
sha256 = "121eb7e55cdb02b000b934250eb417375ca154c1eb87a01cd4be0510050b83c8"
changelog = "First release: auto start on first movement, finish on leaving the End, death is not a finish, auto-reset on a new world, four corners, PB, runs.csv, folder button, /speedrun commands."
